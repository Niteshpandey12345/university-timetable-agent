[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "university-timetable-agent"
version = "4.0.0"
description = "Agentic university timetabling: LangGraph multi-agent workflow over MCP with CP-SAT and genetic-algorithm allocators"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nitesh Pandey" }]
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.3", "langchain-core>=1.6", "langgraph>=1.2", "langgraph-checkpoint-sqlite>=3.1",
  "mcp>=1.29,<2", "ortools>=9.15", "openpyxl>=3.1", "networkx>=3.3", "pandas>=2.2", "pyyaml>=6",
  "pydantic>=2.9", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-dotenv>=1.0",
  "matplotlib>=3.8", "scipy>=1.13",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=4.3"]
claude = ["langchain-anthropic>=1.6"]
dev = ["pytest>=8"]

[project.scripts]
ttagent = "ttagent.cli:main"

[tool.setuptools.packages.find]
include = ["ttagent*", "scripts*"]

[tool.setuptools.package-data]
ttagent = ["api/static/*"]
